<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}TaskTrack{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    {% if session.get('usuario_id') %}
    <nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/tareas">✔ TaskTrack</a>
            <div class="navbar-nav me-auto">
                <a class="nav-link" href="/tareas">Mis Tareas</a>
                <a class="nav-link" href="/categorias">Categorías</a>
            </div>
            <span class="navbar-text me-3">Hola, {{ session.get('usuario_nombre') }}</span>
            <a href="/logout" class="btn btn-outline-light btn-sm">Cerrar Sesión</a>
        </div>
    </nav>
    {% endif %}

    <div class="container py-3">
        {% block contenido %}{% endblock %}
    </div>
</body>

</html>
